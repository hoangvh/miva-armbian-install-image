# ============================================================
# MIVA deployment configuration - canonical template
# Build profile: lpddr3
# FAT32 volume label: MIVA-CONFIG
# ============================================================

# Temporary SD installer runtime
INSTALLER_IP=192.168.10.48
INSTALLER_PREFIX=24
INSTALLER_GATEWAY=192.168.10.1
INSTALLER_DNS=192.168.10.1,1.1.1.1
INSTALLER_PASSWORD=change-me-installer

# Physical status LED. Leave empty if a board does not use this GPIO.
LED_GPIO=262

# Build-miva.sh substitutes only these release fields.
FIRMWARE_VERSION=miva-lpddr3-260923-1044
# IMAGE_FILE may end in .img or .img.xz.
IMAGE_FILE=miva-lpddr3-260923-1044.img.xz
VERIFY_SHA256=yes

# Production device provisioning
DEVICE_IP=192.168.1.102
DEVICE_PREFIX=24
DEVICE_GATEWAY=192.168.1.1
DEVICE_DNS=192.168.1.1,1.1.1.1
DEVICE_PASSWORD=admin123@
DEVICE_HOSTNAME=miva

# MIVA Docker archive selector. The matching miva-${MIVA_TAG}.tar is copied
# from MIVA-CONFIG to eMMC and loaded on the first eMMC boot.
MIVA_TAG=v3.0.5p8

# Successful installer: slow LED 10s then power off
SHUTDOWN_AFTER=yes
